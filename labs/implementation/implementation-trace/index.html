<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Implementation Trace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <p class="eyebrow">AB Engineering Lab · Implementation</p>
    <h1>Evidence → action → re-measurement</h1>
    <p>Structured traceability without pretending that observations prove causality.</p>
  </header>
  <section class="card">
    <h2>Trace item</h2>
    <div class="grid">
      <label>Requirement<input id="requirement" value="Expected practice is followed"></label>
      <label>Observed practice<input id="observation" value="Observed in sample"></label>
      <label>Evidence<input id="evidence" value="Audit record"></label>
      <label>Status<select id="status"><option>Verified</option><option>Partial</option><option>Gap</option><option>Unknown</option><option>Hypothesis</option></select></label>
      <label>Hypothesis<input id="hypothesis" placeholder="Only if a hypothesis is needed"></label>
      <label>Action<input id="action" placeholder="Next action"></label>
    </div>
    <button id="add" type="button">Add trace</button>
  </section>
  <section class="card">
    <div class="toolbar"><h2>Trace register</h2><button id="demo" type="button">Load demo</button></div>
    <div id="empty">No trace items yet.</div>
    <div id="list"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
