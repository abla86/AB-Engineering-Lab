<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProcessGuard — Process Drift Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">AB Engineering Lab · Data</p>
      <h1>ProcessGuard</h1>
      <p>Detect measurable drift in recurring processes.</p>
    </header>

    <section class="card">
      <h2>Observation</h2>
      <div class="grid">
        <label>Target %<input id="t" type="number" min="0" max="100" step="0.1" value="95"></label>
        <label>Previous %<input id="p" type="number" min="0" max="100" step="0.1" value="94"></label>
        <label>Current %<input id="c" type="number" min="0" max="100" step="0.1" value="79"></label>
        <label>Sample n<input id="n" type="number" min="0" step="1" value="150"></label>
      </div>
      <button id="go" type="button">Check process</button>
    </section>

    <section id="out" class="card" aria-live="polite"></section>

    <footer>Monitoring aid only. Review measurement quality, context and possible causes before action.</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
