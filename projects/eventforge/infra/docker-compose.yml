services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eventforge
      POSTGRES_USER: eventforge
      POSTGRES_PASSWORD: eventforge_dev_only
    ports: ["5432:5432"]
    volumes: [eventforge-postgres:/var/lib/postgresql/data]
  kafka:
    image: bitnami/kafka:3.9
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
  api:
    build: ../api
    environment:
      PORT: "4100"
      KAFKA_BROKER: "kafka:9092"
      KAFKA_TOPIC: "work-events"
      DATABASE_URL: "postgresql://eventforge:eventforge_dev_only@postgres:5432/eventforge"
    ports: ["4100:4100"]
    depends_on: [kafka,postgres]
volumes:
  eventforge-postgres:
