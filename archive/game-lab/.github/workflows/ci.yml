name: Game Lab CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Integrity and security audit
        shell: pwsh
        run: ./tests/integrity-check.ps1

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
