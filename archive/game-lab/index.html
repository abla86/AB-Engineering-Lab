script src="js/engines/evidence-quest.js"></script><script src="js/engines/shape-forge.js"></script><script src="js/engines/shape-mosaic.js"></script><script src="js/engines/mini-crossword.js"></script><script>labRuntime.registerEngine('chess',{title:'01 · Cyber Chess AI',tag:'Minimax Prototype',shortDesc:'Adversarial search demonstrator.',concept:'Minimax + Alpha-Beta + position heuristics.',complexity:'O(b^(d/2))'},CyberChessEngine);labRuntime.registerEngine('c4',{title:'02 · Connect 4',tag:'Alpha-Beta',shortDesc:'Recursive game-tree search.',concept:'Heuristic evaluation with Alpha-Beta pruning.',complexity:'O(b^(d/2))'},Connect4Engine);labRuntime.registerEngine('sql',{title:'03 · SQL Dungeon',tag:'AST',shortDesc:'In-memory query engine.',concept:'Constrained SELECT/WHERE parsing and deterministic evaluation.',complexity:'O(N)'},SqlDungeonEngine);labRuntime.registerEngine('firewall',{title:'04 · Network Defender',tag:'Security DPI',shortDesc:'Packet inspection simulator.',concept:'ACL rules and stateful packet filtering.',complexity:'O(Rules × Packets)'},NetworkDefenderEngine);labRuntime.registerEngine('packet',{title:'05 · Packet Rush',tag:'TCP State Machine',shortDesc:'Protocol state visualizer.',concept:'SYN → SYN-ACK → ACK with RTT telemetry.',complexity:'O(1) transitions'},PacketRushEngine);labRuntime.registerEngine('api',{title:'06 · API Outbreak',tag:'Rate Limiter',shortDesc:'Traffic burst simulator.',concept:'Token-bucket rate limiting and HTTP 429 behavior.',complexity:'O(1)'},ApiOutbreakEngine);labRuntime.registerEngine('devops',{title:'07 · DevOps Pipeline',tag:'CI/CD DAG',shortDesc:'Pipeline recovery simulator.',concept:'Stage traversal and recovery.',complexity:'O(V + E)'},DevOpsPipelineEngine);labRuntime.registerEngine('lru',{title:'08 · Memory Matrix',tag:'LRU Cache',shortDesc:'Cache eviction simulator.',concept:'Least-recently-used access and eviction.',complexity:'O(1)'},MemoryMatrixEngine);labRuntime.registerEngine('regex',{title:'09 · Regex Vault',tag:'Pattern Engine',shortDesc:'Pattern validation challenge.',concept:'Runtime pattern matching and validation.',complexity:'O(N)'},RegexVaultEngine);labRuntime.registerEngine('mosaic',{title:'12 · Shape Swarm',tag:'Emergent Geometry',shortDesc:'Former samler seg til bilder.',concept:'Hvordan lokale geometriske elementer kan danne en gjenkjennelig helhet.',complexity:'O(N)'},ShapeMosaicEngine);labRuntime.registerEngine('crossword',{title:'13 · Mini-kryssord',tag:'Knowledge Game',shortDesc:'Lite kryssord med kunnskapsledetråder.',concept:'Ordforråd, mønstergjenkjenning og aktiv gjenhenting.',complexity:'O(C)'},MiniCrosswordEngine);labRuntime.registerEngine('shapes',{title:'11 · Shape Forge',tag:'Geometry Game',shortDesc:'Bygg figurer og lær geometri.',concept:'Geometriske former, egenskaper og visuell problemløsing.',complexity:'O(K)'},ShapeForgeEngine);labRuntime.registerEngine('evidence',{title:'10 · Evidence Quest',tag:'Evidence Model',shortDesc:'Multi-criteria evidence demonstrator.',concept:'Weighted scoring prototype linked conceptually to Evidence Lab.',complexity:'O(K)'},EvidenceQuestEngine);labRuntime.mountEngine('chess');</script><script>
(function(){
 const ids=['chess','c4','sql','firewall','packet','api','devops','lru','regex','mosaic','crossword','shapes','evidence'];
 let pos=0;
 function mount(id){labRuntime.mountEngine(id);pos=Math.max(0,ids.indexOf(id));}
 document.getElementById('random-engine').onclick=()=>mount(ids[Math.floor(Math.random()*ids.length)]);
 document.getElementById('cycle-engine').onclick=()=>{pos=(pos+1)%ids.length;mount(ids[pos]);};
 const keys={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1};
 document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,button'))return;if(keys[e.key]){e.preventDefault();pos=(pos+keys[e.key]+ids.length)%ids.length;mount(ids[pos]);}});
})();
</script></body></html>
