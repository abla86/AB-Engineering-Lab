<!doctype html><html lang="no"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>DevOps Pipeline Simulator</title><style>body{font:16px system-ui;max-width:900px;margin:40px auto;padding:0 18px;background:#0d1117;color:#e6edf3}button{padding:10px 14px;margin:4px;border:0;border-radius:8px;cursor:pointer}li{margin:10px 0;padding:12px;border:1px solid #30363d;border-radius:8px}progress{width:100%}.ok{border-color:#238636}</style><h1>DevOps Pipeline Simulator</h1><p>Interaktiv demonstrasjon av en CI/CD-pipeline. Ingen eksterne tjenester.</p><button id="run">Kjør pipeline</button><button id="reset">Nullstill</button><progress id="p" max="4" value="0"></progress><ol id="log"></ol><script>const stages=['Checkout','Lint / Security','Container Build','Kubernetes Rollout'];let i=0,tm;const log=document.querySelector('#log'),p=document.querySelector('#p');function reset(){clearTimeout(tm);i=0;p.value=0;log.innerHTML='';}function run(){if(i>=stages.length)return;const li=document.createElement('li');li.textContent='⏳ '+stages[i]+' …';log.append(li);tm=setTimeout(()=>{li.textContent='✓ '+stages[i]+' — simulert OK';li.className='ok';i++;p.value=i;run()},500)}document.querySelector('#run').onclick=()=>{reset();run()};document.querySelector('#reset').onclick=reset;</script>
