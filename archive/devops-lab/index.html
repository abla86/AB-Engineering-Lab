<body class="grid-bg">
<div class="shell">
<header class="header">
<div>
<div class="eyebrow">AB ENGINEERING · DEVOPS NODE</div>
<h1>DEVOPS LAB</h1>
<p class="subtitle">ORCHESTRATION · CI/CD · DAG SCHEDULING · HEALTH PROBES</p>
</div>
<div class="status"><i></i>SYSTEM ONLINE</div>
</header>
<main class="layout">
<aside class="panel matrix">
<div class="matrix-title">DEVOPS ENGINES · 02</div>
<div id="engine-matrix" class="engine-list"></div>
</aside>
<section class="panel workspace">
<div id="engine-viewport" class="viewport"></div>
<div class="inspector">
<div><strong id="ins-title">--</strong><span id="ins-tag"></span><p id="ins-desc">--</p></div>
<div><div id="ins-complexity" class="metric">--</div><div id="ins-metrics" class="metrics"></div></div>

</div>
<script src="js/lab-runtime.js"></script>
<script src="js/engines/pipeline-dag.js"></script>
<script src="js/engines/container-prober.js"></script>
<script>
labRuntime.registerEngine("dag",{
  title:"01 · Pipeline DAG",
  tag:"CI/CD Demonstrator",
  shortDesc:"Avhengighetsdrevet pipeline visualisert som kjørbare stages.",
  concept:"Simulerer en rettet asyklisk pipeline med kontrollert state og feilgrenser.",
  complexity:"O(V + E)"
},PipelineDagEngine);
labRuntime.registerEngine("prober",{
  title:"02 · Container Prober",
  tag:"Health Model",
  shortDesc:"Liveness/readiness og restart-policy i en interaktiv modell.",
  concept:"Modellerer hvordan helsekontroller påvirker tilgjengelighet og restart-state.",
  complexity:"O(1)"
},ContainerProberEngine);
labRuntime.mountEngine("dag");
</script>
