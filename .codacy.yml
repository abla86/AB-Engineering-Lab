---
# Archived snapshots are retained for reference and are not active application code.
# Keep current projects and security-training code in the analysis scope.
exclude_paths:
  - "archive/**"
  - "security-lab/**"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/coverage/**"
  - "**/.venv/**"
  - "**/__pycache__/**"
