name: Security Lab

on:
  push:
    paths:
      - 'security-lab/**'
      - '.github/workflows/security-lab.yml'
  pull_request:
    paths:
      - 'security-lab/**'
      - '.github/workflows/security-lab.yml'

permissions:
  contents: read

jobs:
  security-lab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: security-lab
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: security-lab/requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run security regression tests
        run: pytest -q
