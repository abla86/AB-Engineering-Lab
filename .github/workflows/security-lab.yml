name: Security Lab

on:
  push:
    paths:
      - 'security-lab/**'
      - '.github/workflows/security-lab.yml'
  pull_request:
    paths:
      - 'security-lab/**'
      - '.github/workflows/security-lab.yml'

permissions:
  contents: read

concurrency:
  group: security-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-lab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: security-lab
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: security-lab/requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run security regression tests
        run: pytest -q
