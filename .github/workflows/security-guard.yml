name: Security Guard
on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify all npm projects
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' p; do
            found=1
            d="$(dirname "$p")"
            echo "::group::Verify npm project: $d"
            pushd "$d" >/dev/null
            if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
              # Lockfile drift is a repository defect; fail instead of silently repairing
              # the lockfile only inside the ephemeral runner.
              npm ci --no-audit --no-fund
            else
              echo "::warning::No npm lockfile in $d; using npm install, so dependency resolution is not fully reproducible."
              npm install --no-audit --no-fund
            fi
            npm audit --audit-level=high
            npm test --if-present
            npm run build --if-present
            popd >/dev/null
            echo "::endgroup::"
          done < <(find . -type f -name package.json -not -path '*/node_modules/*' -not -path './.git/*' -not -path './archive/*' -print0)
          if [[ "$found" -eq 0 ]]; then
            echo "No active npm projects found; skipping npm checks."
          fi
