name: ChangeStory CI

on:
  push:
    paths:
      - "projects/changestory/**"
      - ".github/workflows/changestory-ci.yml"
  pull_request:
    paths:
      - "projects/changestory/**"
      - ".github/workflows/changestory-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/changestory
    steps:
dependabot/github_actions/actions/setup-node-7
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
main
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
