name: ChangeStory CI

on:
  push:
    paths:
      - "projects/changestory/**"
      - ".github/workflows/changestory-ci.yml"
  pull_request:
    paths:
      - "projects/changestory/**"
      - ".github/workflows/changestory-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/changestory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/changestory/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
