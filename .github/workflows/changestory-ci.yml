name: ChangeStory CI

on:
  push:
    paths:
      - "projects/changestory/**"
      - ".github/workflows/changestory-ci.yml"
  pull_request:
    paths:
      - "projects/changestory/**"
      - ".github/workflows/changestory-ci.yml"

permissions:
  contents: read

concurrency:
  group: changestory-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: projects/changestory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
