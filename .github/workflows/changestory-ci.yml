name: ChangeStory CI

on:
  push:
    paths:
      - "projects/changestory/**"
      - ".github/workflows/changestory-ci.yml"
  pull_request:
    paths:
      - "projects/changestory/**"
      - ".github/workflows/changestory-ci.yml"

permissions:
  contents: read

concurrency:
  group: changestory-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/changestory
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/changestory/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
