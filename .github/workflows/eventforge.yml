name: EventForge CI
on:
  push:
    paths: ["projects/eventforge/**"]
  pull_request:
    paths: ["projects/eventforge/**"]
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/eventforge/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/eventforge/api/package.json
      - run: npm install
      - run: npm run lint
      - run: npm test
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/eventforge/consumers/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m py_compile consumer.py
  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/eventforge/consumers/dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore
      - run: dotnet build --no-restore
  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/eventforge/consumers/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: mvn -B compile
  kotlin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/eventforge/consumers/kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle build
