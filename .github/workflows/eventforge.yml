name: EventForge CI

on:
  push:
    paths:
      - "projects/eventforge/**"
      - ".github/workflows/eventforge.yml"
  pull_request:
    paths:
      - "projects/eventforge/**"

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: projects/eventforge/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/eventforge/api/package.json
      - run: npm install
      - run: npm run lint
      - run: npm test

  python:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: projects/eventforge/consumers/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m py_compile consumer.py

  dotnet:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: projects/eventforge/consumers/dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore
      - run: dotnet build --no-restore

  wolverine:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: projects/eventforge/consumers/wolverine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore

  java:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: projects/eventforge/consumers/java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "21"
      - run: mvn -B compile

  kotlin:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: projects/eventforge/consumers/kotlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - run: gradle build

  go:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: projects/eventforge/consumers/go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25.x"
          cache-dependency-path: projects/eventforge/consumers/go/go.mod
      - run: go mod download
      - run: go test ./...
      - run: go vet ./...
