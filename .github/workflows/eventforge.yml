name: EventForge CI
on:
  push:
    paths:
      - "projects/eventforge/**"
      - ".github/workflows/eventforge.yml"
  pull_request:
    paths: ["projects/eventforge/**"]
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/eventforge/api
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/eventforge/api/package.json
      - run: npm install
      - run: npm run lint
      - run: npm test
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/eventforge/consumers/python
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m py_compile consumer.py
  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/eventforge/consumers/dotnet
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore
      - run: dotnet build --no-restore
  wolverine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/eventforge/consumers/wolverine
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/eventforge/consumers/java
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21"
      - run: mvn -B compile
  kotlin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/eventforge/consumers/kotlin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - run: gradle build
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/eventforge/consumers/go
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.25.x"
          cache-dependency-path: projects/eventforge/consumers/go/go.mod
      - run: go mod download
      - run: go test ./...
      - run: go vet ./...
