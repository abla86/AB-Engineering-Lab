name: Security Training Lab

on:
  push:
    paths:
      - "security-lab/**"
      - ".github/workflows/security-training.yml"
  pull_request:
    paths:
      - "security-lab/**"
      - ".github/workflows/security-training.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-training-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r security-lab/requirements.txt
      - name: Run security lab tests
        run: python -m pytest -q security-lab/test_security_lab.py security-lab/test_training_engine.py security-lab/test_training_labs.py security-lab/test_security_audit.py security-lab/test_arena.py
      - name: Validate curriculum JSON
        run: python -m json.tool security-lab/training/curriculum.json > /dev/null
      - name: Validate scenario catalogs
        run: python -m json.tool security-lab/training/scenarios.json > /dev/null && python -m json.tool security-lab/training/scenarios-advanced.json > /dev/null
      - name: Run security baseline audit
        run: python security-lab/security_audit.py
      - name: Compile training engine
        run: python -m py_compile security-lab/training_engine.py
